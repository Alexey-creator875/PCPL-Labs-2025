{% extends 'base.html' %}

{% block title %}
Факультеты
{% endblock %}

{% block contentTitle %}
Факультеты
{% endblock %}

{% block content %}

{% for faculty in faculties %}
<div class="row">
    <a href="/faculties/departments/id={{ faculty.id }}" class="rowMainLabel">{{ faculty.facultyName }}</a>
    <div class="rowSecondaryLabel">Количество кафедр: {{ faculty.departmentNumber }} шт.</div>
</div>
{% endfor %}

{% endblock %}
